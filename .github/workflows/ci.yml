name: Skill checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Verify user workflows
        run: python -B -m unittest discover -s tests -p 'test_*.py'
      - name: Verify preserved livestream core
        run: python -B .livestream-core/scripts/livestream.py self-test
